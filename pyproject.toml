[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-nebula-secureagent"
version = "1.1.1"
description = "Configuration-driven Python facade for building secure A2A agents on Agent Nebula Platform"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "agent-nebula-platform>=5.0.0,<6.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9",
  "ruff>=0.11.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_nebula_secureagent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
