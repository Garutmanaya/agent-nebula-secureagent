[project]
name = "agent-nebula-secureagent"
version = "0.1.0"
description = "Protocol-neutral developer interface for Agent Nebula Platform"
requires-python = ">=3.12"
dependencies = [
  "agent-nebula-platform>=0.11.1,<1.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<9.0", "ruff>=0.8,<1.0"]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.12,<1.0",
]

[tool.uv.sources]
agent-nebula-platform = { path = "../agent-nebula-platform", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_nebula_secureagent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
