[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-nebula-secureagent"
version = "1.1.1"
description = "Protocol-neutral developer interface for Agent Nebula Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agent-nebula-platform==1.1.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9",
  "ruff>=0.11.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_nebula_secureagent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
