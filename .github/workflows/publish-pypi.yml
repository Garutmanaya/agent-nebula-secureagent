name: Publish SecureAgent to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build packaging twine

      - name: Set release version and latest compatible Platform dependency
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.request import urlopen
          from packaging.version import Version, InvalidVersion

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:a[0-9]+|b[0-9]+|rc[0-9]+|\.post[0-9]+)?", tag):
              raise SystemExit(f"Unsupported release tag: {tag}")
          version = tag[1:]
          with urlopen("https://pypi.org/pypi/agent-nebula-platform/json", timeout=30) as response:
              metadata = json.load(response)
          candidates = []
          for raw, files in metadata["releases"].items():
              try:
                  candidate = Version(raw)
              except InvalidVersion:
                  continue
              if candidate.major != 5 or candidate.is_prerelease or candidate.is_devrelease:
                  continue
              if files and any(not item.get("yanked", False) for item in files):
                  candidates.append(candidate)
          if not candidates:
              raise SystemExit("No stable non-yanked Platform 5.x release found on PyPI")
          platform_version = str(max(candidates))
          path = Path("pyproject.toml")
          content = path.read_text()
          content, version_count = re.subn(
              r'(?m)^version\s*=\s*"[^"]+"\s*$',
              f'version = "{version}"', content,
          )
          content, dependency_count = re.subn(
              r'"agent-nebula-platform(?:==|>=)[^"]+"',
              f'"agent-nebula-platform=={platform_version}"', content,
          )
          if (version_count, dependency_count) != (1, 1):
              raise SystemExit("Expected one project version and one Platform dependency")
          path.write_text(content)
          print(f"SecureAgent {version}; Platform dependency {platform_version}")
          PYTHON

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-nebula-secureagent
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
